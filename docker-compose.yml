services:
  mongodb:
    image: mongo:7.0
    container_name: vaxassist_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vaxassist_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: vaxassist_chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; exit !(IO::Socket::INET->new(PeerAddr => \"127.0.0.1\", PeerPort => 8000, Timeout => 2));' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  chroma_data:
    driver: local
